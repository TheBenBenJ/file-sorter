# Light CI: syntax checks only. No secret, no deployment, no connection to the Mac,
# the server or iCloud.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14' # as on the Mac (Homebrew) and the server (Ubuntu 26.04)

      - name: Python (py_compile)
        run: |
          status=0
          while IFS= read -r -d '' f; do python -m py_compile "$f" || status=1; done < <(git ls-files -z -- '*.py')
          exit $status

      - name: JSON (json.tool)
        run: |
          status=0
          while IFS= read -r -d '' f; do python -m json.tool "$f" > /dev/null || status=1; done < <(git ls-files -z -- '*.json')
          exit $status
